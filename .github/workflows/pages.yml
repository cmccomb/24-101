name: Validate and deploy course lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check calculation models
        run: npm test
      - name: Check JavaScript and static entrypoint
        run: |
          node --check site/app.js
          node --check site/models.js
          node --check site/systems.js
          node --check site/engineering.js
          node --check site/fabrication.js
          node --check site/fabrication-svg.js
          node --check site/fabrication-worker.js
          node --check site/design/guide.js
          test -s site/index.html
          test -s site/tokens.css
          test -s site/vendor/three.module.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
